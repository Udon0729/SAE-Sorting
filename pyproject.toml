[project]
name = "sae-sorting"
version = "0.1.0"
description = "Causal Knowledge Sorting of SAE Feature Clusters in Pretrained Language Models"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "datasets>=2.20",
    "numpy>=1.26",
    "transformers>=5.7.0",
    "safetensors>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sae_sorting"]
